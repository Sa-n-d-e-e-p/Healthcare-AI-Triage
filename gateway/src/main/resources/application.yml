server:
  port: 8080
spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: admin
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/**
        - id: appts
          uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/appointments/**
        - id: profiles
          uri: ${PROFILE_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/profiles/**
        - id: notify
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/notify/**
        - id: ai-symptoms
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/symptoms/**
        - id: ai-history
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/history/**
        - id: ai-profile
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/user/profile/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
management.endpoints.web.exposure.include: health,info

server:
  port: 8082
  error:
    include-message: always
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthcare}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
app:
  jwt:
    secret: "${JWT_SECRET:CHANGE_ME_SUPER_SECRET_256_BITS_MINIMUM_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}"
  services:
    profile: ${PROFILE_SERVICE_URL:http://localhost:8083}
    notify: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
management.endpoints.web.exposure.include: health,info

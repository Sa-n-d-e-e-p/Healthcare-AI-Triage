services:
  postgres:
    image: postgres:16-alpine
    container_name: omni_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  mongodb:
    image: mongo:7-jammy
    container_name: omni_mongodb_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: omni_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8088:80"
    depends_on:
      - postgres

volumes:
  pg_data_dev:
  mongo_data_dev:
